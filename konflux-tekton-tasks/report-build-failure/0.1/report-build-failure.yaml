apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: report-build-failure
  labels:
    app.kubernetes.io/part-of: build-buddy
spec:
  description: |
    Sends a Slack notification for pipeline failures via Slack API (capturing thread_ts),
    then optionally creates or updates a Jira issue for Build Buddy processing.
    Replaces the webhook-based send-slack-notification task.
  params:
    - name: slack-message
      type: string
      description: Pre-formatted Slack failure message from rhoai-init
    - name: pipeline-run-name
      type: string
      description: Name of the PipelineRun
    - name: component-name
      type: string
      default: ""
      description: Konflux component name (auto-detected from label if not provided)
    - name: git-url
      type: string
      description: Source repository URL
    - name: revision
      type: string
      description: Git revision (commit SHA)
    - name: output-image
      type: string
      description: Fully qualified output image reference
    - name: pipeline-template
      type: string
      description: Pipeline template name
    - name: enable-build-buddy
      type: string
      default: "false"
      description: When true, creates/updates Jira issue. Slack notification always sent.
    - name: jira-project-key
      type: string
      default: "RHOAIENG"
      description: Jira project key for issue creation
  results:
    - name: slack-thread-ts
      description: Slack thread timestamp (empty if Slack API failed)
    - name: slack-channel-id
      description: Slack channel ID where notification was posted
    - name: jira-issue-key
      description: Jira issue key (empty if build-buddy disabled or Jira failed)
    - name: jira-action
      description: created or updated (empty if no Jira action taken)
  steps:
    - name: report-failure
      image: quay.io/rhoai-devops/slack-notifier:latest
      env:
        - name: SLACK_TOKEN
          valueFrom:
            secretKeyRef:
              name: rhoai-devops-bot-slack-token
              key: SLACK_TOKEN
        - name: SLACK_CHANNEL
          valueFrom:
            configMapKeyRef:
              name: build-buddy-config
              key: slack-notification-channel
        - name: JIRA_TOKEN
          valueFrom:
            secretKeyRef:
              name: build-buddy-jira-token
              key: JIRA_TOKEN
              optional: true
        - name: JIRA_URL
          valueFrom:
            configMapKeyRef:
              name: build-buddy-config
              key: jira-url
              optional: true
        - name: JIRA_USER
          valueFrom:
            secretKeyRef:
              name: build-buddy-jira-token
              key: JIRA_USER
              optional: true
        - name: JIRA_EPIC_KEY
          valueFrom:
            configMapKeyRef:
              name: build-buddy-config
              key: jira-epic-key
              optional: true
        - name: SLACK_MESSAGE
          value: $(params.slack-message)
        - name: PIPELINE_RUN_NAME
          value: $(params.pipeline-run-name)
        - name: COMPONENT_NAME
          value: $(params.component-name)
        - name: GIT_URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.revision)
        - name: OUTPUT_IMAGE
          value: $(params.output-image)
        - name: PIPELINE_TEMPLATE
          value: $(params.pipeline-template)
        - name: ENABLE_BUILD_BUDDY
          value: $(params.enable-build-buddy)
        - name: JIRA_PROJECT_KEY
          value: $(params.jira-project-key)
        - name: BUILD_URL
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/log-url']
        - name: COMMIT_URL
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/sha-url']
        - name: PIPELINE_RUN_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: COMPONENT_LABEL
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['appstudio.openshift.io/component']
        - name: COMMIT_AUTHOR
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/sender']
      script: |
        #!/bin/bash
        set -eo pipefail

        RESULTS_DIR="$(results.slack-thread-ts.path)"
        RESULTS_DIR="${RESULTS_DIR%/*}"

        if [ -z "${COMPONENT_NAME}" ] && [ -n "${COMPONENT_LABEL}" ]; then
          COMPONENT_NAME="${COMPONENT_LABEL}"
        fi

        # ── Step 1: Send Slack notification via API ──
        echo "Sending Slack notification for component: ${COMPONENT_NAME}"

        SLACK_FAILED=""
        THREAD_TS=""
        CHANNEL_ID=""

        SLACK_RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
          -H "Authorization: Bearer ${SLACK_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg text "$SLACK_MESSAGE" \
            '{channel: $channel, text: $text, unfurl_links: false}')" \
        ) || {
          echo "WARNING: Slack API call failed (non-blocking)"
          SLACK_FAILED=true
        }

        if [ -z "${SLACK_FAILED}" ]; then
          SLACK_OK=$(echo "$SLACK_RESPONSE" | jq -r '.ok')
          if [ "$SLACK_OK" = "true" ]; then
            THREAD_TS=$(echo "$SLACK_RESPONSE" | jq -r '.ts')
            CHANNEL_ID=$(echo "$SLACK_RESPONSE" | jq -r '.channel')
            echo "Slack notification sent (thread_ts=${THREAD_TS}, channel=${CHANNEL_ID})"
          else
            SLACK_ERROR=$(echo "$SLACK_RESPONSE" | jq -r '.error // "unknown"')
            echo "WARNING: Slack API returned ok=false: ${SLACK_ERROR}"
            SLACK_FAILED=true
          fi
        fi

        printf "%s" "${THREAD_TS}" > "$(results.slack-thread-ts.path)"
        printf "%s" "${CHANNEL_ID}" > "$(results.slack-channel-id.path)"

        # ── Step 2: Create/update Jira (only if Build Buddy enabled) ──
        if [ "${ENABLE_BUILD_BUDDY}" != "true" ]; then
          echo "Build Buddy disabled — skipping Jira"
          printf "" > "$(results.jira-issue-key.path)"
          printf "" > "$(results.jira-action.path)"
          exit 0
        fi

        echo "Build Buddy enabled — checking for existing Jira issues"

        SLACK_THREAD_URL=""
        if [ -n "${THREAD_TS}" ] && [ -n "${CHANNEL_ID}" ]; then
          SLACK_THREAD_URL="https://redhat-internal.slack.com/archives/${CHANNEL_ID}/p${THREAD_TS//./}"
        fi

        REPO_NAME=$(echo "$GIT_URL" | sed 's|.*/||;s|\.git$||')
        TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        SHORT_REV="${REVISION:0:7}"

        # Build the YAML metadata attachment content
        cat > /tmp/build-failure-metadata.yaml <<METADATA_EOF
        component: ${COMPONENT_NAME}
        repository: ${GIT_URL}
        revision: ${REVISION}
        revision_short: ${SHORT_REV}
        commit_author: ${COMMIT_AUTHOR:-unknown}
        failed_task: ${FAILED_TASK:-unknown}
        failed_message: ${FAILED_MESSAGE:-N/A}
        pipelinerun: ${PIPELINE_RUN_NAME}
        pipeline_template: ${PIPELINE_TEMPLATE}
        build_log_url: ${BUILD_URL}
        commit_url: ${COMMIT_URL}
        output_image: ${OUTPUT_IMAGE}
        namespace: ${PIPELINE_RUN_NAMESPACE}
        slack_thread_url: ${SLACK_THREAD_URL}
        slack_thread_ts: ${THREAD_TS}
        slack_channel_id: ${CHANNEL_ID}
        timestamp: ${TIMESTAMP}
        METADATA_EOF

        AUTH_HEADER="Authorization: Basic $(echo -n "${JIRA_USER}:${JIRA_TOKEN}" | base64 -w 0)"

        # ── Extract failed task info from K8s API ──
        FAILED_TASK=""
        FAILED_MESSAGE=""
        K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)
        K8S_CA="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        K8S_API="https://kubernetes.default.svc"

        if [ -n "${K8S_TOKEN}" ]; then
          TASKRUNS_JSON=$(curl -s --cacert "$K8S_CA" \
            -H "Authorization: Bearer $K8S_TOKEN" \
            "${K8S_API}/apis/tekton.dev/v1/namespaces/${PIPELINE_RUN_NAMESPACE}/taskruns?labelSelector=tekton.dev/pipelineRun=${PIPELINE_RUN_NAME}" \
          ) || true

          if echo "$TASKRUNS_JSON" | jq -e '.items' > /dev/null 2>&1; then
            FAILED_TASK=$(echo "$TASKRUNS_JSON" | jq -r '
              [.items[] |
               select(.status.conditions[]? | select(.type=="Succeeded" and .status=="False"))] |
               first |
               .metadata.labels["tekton.dev/pipelineTask"] // empty' 2>/dev/null || true)

            FAILED_MESSAGE=$(echo "$TASKRUNS_JSON" | jq -r '
              [.items[] |
               select(.status.conditions[]? | select(.type=="Succeeded" and .status=="False"))] |
               first |
               .status.conditions[] | select(.type=="Succeeded") | .message // empty' 2>/dev/null || true)

            # Truncate long error messages
            if [ ${#FAILED_MESSAGE} -gt 300 ]; then
              FAILED_MESSAGE="${FAILED_MESSAGE:0:300}..."
            fi
          fi

          if [ -n "${FAILED_TASK}" ]; then
            echo "Failed task: ${FAILED_TASK}"
          else
            echo "Could not determine failed task"
          fi
        fi

        FAILED_TASK_LABEL=""
        if [ -n "${FAILED_TASK}" ]; then
          FAILED_TASK_LABEL="failed-task:${FAILED_TASK}"
        fi

        # Build Slack failure summary for thread replies
        SLACK_FAILURE_SUMMARY=""
        if [ -n "${FAILED_TASK}" ]; then
          SLACK_FAILURE_SUMMARY="\n:x: *Failed task:* \`${FAILED_TASK}\`"
        fi
        if [ -n "${FAILED_MESSAGE}" ]; then
          SHORT_ERROR="${FAILED_MESSAGE}"
          if [ ${#SHORT_ERROR} -gt 150 ]; then
            SHORT_ERROR="${SHORT_ERROR:0:150}..."
          fi
          SLACK_FAILURE_SUMMARY="${SLACK_FAILURE_SUMMARY}\n:memo: \`${SHORT_ERROR}\`"
        fi
        SLACK_FAILURE_SUMMARY="${SLACK_FAILURE_SUMMARY}\n:bust_in_silhouette: *Commit by:* ${COMMIT_AUTHOR:-unknown} | *Rev:* \`${SHORT_REV}\`"

        # ── Duplicate detection ──
        COMPONENT_LABEL="component:${COMPONENT_NAME}"
        JQL="project = ${JIRA_PROJECT_KEY} AND labels = ops-buddy AND labels = build-failure AND labels = \"${COMPONENT_LABEL}\" AND status != Done AND created >= -7d"
        if [ -n "${FAILED_TASK_LABEL}" ]; then
          JQL="${JQL} AND labels = \"${FAILED_TASK_LABEL}\""
        fi

        SEARCH_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -G "${JIRA_URL}/rest/api/3/search/jql" \
          -H "${AUTH_HEADER}" \
          --data-urlencode "jql=${JQL}" \
          --data-urlencode "maxResults=1" \
          --data-urlencode "fields=key,status,summary" \
        ) || true
        HTTP_CODE=$(echo "$SEARCH_RESPONSE" | tail -1 | sed 's/HTTP_CODE://')
        SEARCH_RESPONSE=$(echo "$SEARCH_RESPONSE" | sed '$d')
        if [ "$HTTP_CODE" != "200" ]; then
          echo "WARNING: Jira search failed (HTTP ${HTTP_CODE}) — will create new issue"
          SEARCH_RESPONSE='{"issues":[]}'
        fi

        EXISTING_COUNT=$(echo "$SEARCH_RESPONSE" | jq -r '.issues | length')

        if [ "$EXISTING_COUNT" -gt 0 ]; then
          # ── Update existing issue ──
          EXISTING_KEY=$(echo "$SEARCH_RESPONSE" | jq -r '.issues[0].key')
          echo "Found existing issue ${EXISTING_KEY} — adding comment (${EXISTING_COUNT} existing failure(s) this week)"

          # Get comment count to determine failure number
          COMMENT_COUNT_RESP=$(curl -s -G "${JIRA_URL}/rest/api/3/issue/${EXISTING_KEY}/comment" \
            -H "${AUTH_HEADER}" \
            --data-urlencode "maxResults=0" \
          ) || true
          FAILURE_NUM=$(( $(echo "$COMMENT_COUNT_RESP" | jq -r '.total // 0') + 2 ))

          COMMENT_CONTENT=$(jq -n \
            --arg comp "$COMPONENT_NAME" \
            --arg ts "$TIMESTAMP" \
            --arg pr "$PIPELINE_RUN_NAME" \
            --arg rev "$SHORT_REV" \
            --arg commit_url "$COMMIT_URL" \
            --arg build_url "$BUILD_URL" \
            --arg commit_author "${COMMIT_AUTHOR:-unknown}" \
            --arg failed_task "${FAILED_TASK:-}" \
            --arg failed_message "${FAILED_MESSAGE:-}" \
            --arg slack_url "${SLACK_THREAD_URL:-N/A}" \
            --arg failure_num "Failure #${FAILURE_NUM}" \
            '[
              {type: "text", text: ($failure_num + " for " + $comp + " at " + $ts), marks: [{type: "strong"}]},
              {type: "text", text: ("\nCommit by: " + $commit_author)},
              {type: "text", text: "\nPipelineRun: " },
              {type: "text", text: $pr},
              {type: "text", text: "\nRevision: "},
              {type: "text", text: $rev, marks: [{type: "link", attrs: {href: $commit_url}}]},
              {type: "text", text: "\nBuild Log: "},
              {type: "text", text: "View", marks: [{type: "link", attrs: {href: $build_url}}]},
              {type: "text", text: "\nSlack Thread: "},
              {type: "text", text: "Thread", marks: [{type: "link", attrs: {href: $slack_url}}]}
            ]
            + if $failed_task != "" then [
              {type: "text", text: "\nFailed Task: "},
              {type: "text", text: $failed_task, marks: [{type: "strong"}]}
            ] else [] end
            + if $failed_message != "" then [
              {type: "text", text: "\nError: "},
              {type: "text", text: $failed_message, marks: [{type: "code"}]}
            ] else [] end')

          COMMENT_PAYLOAD=$(jq -n \
            --argjson content "$COMMENT_CONTENT" \
            '{body: {version: 1, type: "doc", content: [{type: "paragraph", content: $content}]}}')

          curl -sf -X POST "${JIRA_URL}/rest/api/3/issue/${EXISTING_KEY}/comment" \
            -H "${AUTH_HEADER}" \
            -H "Content-Type: application/json" \
            -d "$COMMENT_PAYLOAD" \
          > /dev/null 2>&1 \
          && echo "Comment added to ${EXISTING_KEY}" \
          || echo "WARNING: Failed to add comment to ${EXISTING_KEY}"

          # Escalate priority to High if 3+ failures
          if [ "$FAILURE_NUM" -ge 3 ]; then
            curl -sf -X PUT "${JIRA_URL}/rest/api/3/issue/${EXISTING_KEY}" \
              -H "${AUTH_HEADER}" \
              -H "Content-Type: application/json" \
              -d '{"fields":{"priority":{"name":"Critical"}}}' \
            > /dev/null 2>&1 \
            && echo "Priority escalated to Critical (${FAILURE_NUM} failures)" \
            || echo "WARNING: Failed to escalate priority"
          fi

          # Attach updated metadata YAML
          curl -sf -X POST "${JIRA_URL}/rest/api/3/issue/${EXISTING_KEY}/attachments" \
            -H "${AUTH_HEADER}" \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@/tmp/build-failure-metadata.yaml" \
          > /dev/null 2>&1 || echo "WARNING: Failed to attach metadata to ${EXISTING_KEY}"

          printf "%s" "$EXISTING_KEY" > "$(results.jira-issue-key.path)"
          printf "updated" > "$(results.jira-action.path)"

          # Post Jira link back to Slack thread (updated)
          if [ -n "${THREAD_TS}" ] && [ -z "${SLACK_FAILED}" ]; then
            curl -sf -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg channel "$CHANNEL_ID" \
                --arg thread_ts "$THREAD_TS" \
                --arg text ":jira: Build Buddy: updated existing issue <${JIRA_URL}/browse/${EXISTING_KEY}|${EXISTING_KEY}> (failure #${FAILURE_NUM})${SLACK_FAILURE_SUMMARY}" \
                '{channel: $channel, thread_ts: $thread_ts, text: $text}')" \
            > /dev/null 2>&1 || echo "WARNING: Failed to post Jira link to Slack thread"
          fi
        else
          # ── Create new issue ──
          echo "No existing issue — creating new Jira issue"

          if [ -n "${FAILED_TASK}" ]; then
            ISSUE_SUMMARY="[Build Failure] ${COMPONENT_NAME} - ${FAILED_TASK} failed ($(date -u +%Y-%m-%d))"
          else
            ISSUE_SUMMARY="[Build Failure] ${COMPONENT_NAME} - ${REPO_NAME} ($(date -u +%Y-%m-%d))"
          fi

          # Build ADF description content
          DESC_CONTENT=$(jq -n \
            --arg component_name "$COMPONENT_NAME" \
            --arg repo_name "$REPO_NAME" \
            --arg git_url "$GIT_URL" \
            --arg short_rev "$SHORT_REV" \
            --arg commit_url "$COMMIT_URL" \
            --arg build_url "$BUILD_URL" \
            --arg commit_author "${COMMIT_AUTHOR:-unknown}" \
            --arg pipeline_template "$PIPELINE_TEMPLATE" \
            --arg slack_url "${SLACK_THREAD_URL:-N/A}" \
            --arg failed_task "${FAILED_TASK:-}" \
            --arg failed_message "${FAILED_MESSAGE:-}" \
            '[
              {type: "paragraph", content: [{type: "text", text: "Build failure detected by Build Buddy.", marks: [{type: "strong"}]}]},
              {type: "paragraph", content: [
                {type: "text", text: "Component: ", marks: [{type: "strong"}]},
                {type: "text", text: $component_name},
                {type: "text", text: "\nRepository: ", marks: [{type: "strong"}]},
                {type: "text", text: $repo_name, marks: [{type: "link", attrs: {href: $git_url}}]},
                {type: "text", text: "\nPipeline: ", marks: [{type: "strong"}]},
                {type: "text", text: $pipeline_template},
                {type: "text", text: "\nCommit by: ", marks: [{type: "strong"}]},
                {type: "text", text: $commit_author},
                {type: "text", text: "\nRevision: ", marks: [{type: "strong"}]},
                {type: "text", text: $short_rev, marks: [{type: "link", attrs: {href: $commit_url}}]},
                {type: "text", text: "\nBuild Log: ", marks: [{type: "strong"}]},
                {type: "text", text: "View Log", marks: [{type: "link", attrs: {href: $build_url}}]},
                {type: "text", text: "\nSlack Thread: ", marks: [{type: "strong"}]},
                {type: "text", text: "View Thread", marks: [{type: "link", attrs: {href: $slack_url}}]}
              ]}
            ]
            + if $failed_task != "" then
              [{type: "paragraph", content: (
                [{type: "text", text: "Failed Task: ", marks: [{type: "strong"}]},
                 {type: "text", text: $failed_task}]
                + if $failed_message != "" then
                  [{type: "text", text: "\nError: "},
                   {type: "text", text: $failed_message, marks: [{type: "code"}]}]
                  else [] end
              )}]
            else [] end')

          # Build labels array
          LABELS_JSON=$(jq -n \
            --arg component_label "$COMPONENT_LABEL" \
            --arg failed_task_label "${FAILED_TASK_LABEL:-}" \
            '["ops-buddy", "build-failure", "unprocessed", "no-autofix", $component_label]
            + if $failed_task_label != "" then [$failed_task_label] else [] end')

          # Build the create payload
          CREATE_PAYLOAD=$(jq -n \
            --arg project "$JIRA_PROJECT_KEY" \
            --arg summary "$ISSUE_SUMMARY" \
            --argjson desc_content "$DESC_CONTENT" \
            --argjson labels "$LABELS_JSON" \
            --arg epic_key "${JIRA_EPIC_KEY:-}" \
            '{
              fields: {
                project: {key: $project},
                summary: $summary,
                description: {version: 1, type: "doc", content: $desc_content},
                issuetype: {name: "Bug"},
                labels: $labels
              }
            }
            | if $epic_key != "" then .fields["customfield_12311140"] = $epic_key else . end')

          CREATE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "${JIRA_URL}/rest/api/3/issue" \
            -H "${AUTH_HEADER}" \
            -H "Content-Type: application/json" \
            -d "$CREATE_PAYLOAD" \
          ) || true
          CREATE_HTTP=$(echo "$CREATE_RESPONSE" | tail -1 | sed 's/HTTP_CODE://')
          CREATE_RESPONSE=$(echo "$CREATE_RESPONSE" | sed '$d')
          if [ "$CREATE_HTTP" != "201" ]; then
            echo "ERROR: Failed to create Jira issue (HTTP ${CREATE_HTTP}): ${CREATE_RESPONSE}"
            printf "" > "$(results.jira-issue-key.path)"
            printf "" > "$(results.jira-action.path)"
            exit 0
          fi

          NEW_KEY=$(echo "$CREATE_RESPONSE" | jq -r '.key')
          echo "Created Jira issue: ${NEW_KEY}"

          # Attach metadata YAML
          curl -sf -X POST "${JIRA_URL}/rest/api/3/issue/${NEW_KEY}/attachments" \
            -H "${AUTH_HEADER}" \
            -H "X-Atlassian-Token: no-check" \
            -F "file=@/tmp/build-failure-metadata.yaml" \
          > /dev/null 2>&1 || echo "WARNING: Failed to attach metadata to ${NEW_KEY}"

          printf "%s" "$NEW_KEY" > "$(results.jira-issue-key.path)"
          printf "created" > "$(results.jira-action.path)"

          # Post Jira link back to Slack thread
          if [ -n "${THREAD_TS}" ] && [ -z "${SLACK_FAILED}" ]; then
            curl -sf -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg channel "$CHANNEL_ID" \
                --arg thread_ts "$THREAD_TS" \
                --arg text ":jira: Build Buddy: created new issue <${JIRA_URL}/browse/${NEW_KEY}|${NEW_KEY}>${SLACK_FAILURE_SUMMARY}" \
                '{channel: $channel, thread_ts: $thread_ts, text: $text}')" \
            > /dev/null 2>&1 || echo "WARNING: Failed to post Jira link to Slack thread"
          fi
        fi

        echo "report-build-failure complete"
